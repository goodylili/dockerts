[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dockerts"
version = "0.1.0"
description = "A small FastAPI service, ready to be containerised"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
dockerts = "dockerts.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dockerts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
