name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: backend (lint, types, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biodata
          POSTGRES_PASSWORD: biodata
          POSTGRES_DB: biodata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biodata -d biodata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql+psycopg://biodata:biodata@localhost:5432/biodata_test
      DATABASE_URL: postgresql+psycopg://biodata:biodata@localhost:5432/biodata_test
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.29"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: frontend (lint, types, build, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://localhost:8000

      - name: Test
        run: npm test

  docker:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: biodata-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-smoke:
    name: compose smoke (idempotent replay)
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time" >&2
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000; then
              echo "frontend healthy"; exit 0
            fi
            sleep 2
          done
          echo "frontend did not become healthy in time" >&2
          exit 1

      - name: Idempotent replay check (POST twice, same Idempotency-Key)
        run: |
          set -euo pipefail
          KEY="ci-smoke-$(date +%s)-$RANDOM"
          BODY='{
            "full_name": "Ada Lovelace",
            "email": "ada@example.com",
            "phone": "+2348012345678",
            "date_of_birth": "1990-05-02",
            "sex": "female",
            "height_cm": 170.0,
            "weight_kg": 62.5,
            "blood_type": "O+",
            "country": "NG"
          }'

          post() {
            curl -sS -o "$1" -w '%{http_code}' \
              -X POST http://localhost:8000/api/v1/bio-records \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: $KEY" \
              -d "$BODY"
          }

          CODE1=$(post /tmp/r1.json)
          CODE2=$(post /tmp/r2.json)

          echo "first:  $CODE1 $(cat /tmp/r1.json)"
          echo "second: $CODE2 $(cat /tmp/r2.json)"

          if [ "$CODE1" != "201" ]; then
            echo "FAIL: first POST expected 201, got $CODE1" >&2; exit 1
          fi
          if [ "$CODE2" != "200" ]; then
            echo "FAIL: replayed POST expected 200, got $CODE2" >&2; exit 1
          fi

          ID1=$(jq -r '.id' /tmp/r1.json)
          ID2=$(jq -r '.id' /tmp/r2.json)
          if [ -z "$ID1" ] || [ "$ID1" = "null" ]; then
            echo "FAIL: first response had no id" >&2; exit 1
          fi
          if [ "$ID1" != "$ID2" ]; then
            echo "FAIL: replay returned a different id ($ID1 != $ID2) — write is not replay-safe" >&2
            exit 1
          fi
          echo "OK: replay returned the same record ($ID1)"

      - name: Frontend proxy reachable
        run: curl -fsS -o /dev/null "http://localhost:3000/api/bio-records?limit=1"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=400

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
